# Automatische Tests bei jeder Änderung (Android = Chromium, iPhone = WebKit/Safari-Technik)
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Android + iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test-Werkzeug installieren
        run: npm ci
      - name: Browser installieren (bei Störungen der Paketserver bis zu 3 Versuche)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && npx playwright install --with-deps chromium webkit && exit 0
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 20 s …"; sleep 20
          done
          exit 1
      - name: Tests ausführen
        run: npx playwright test
      - name: Testbericht speichern (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: |
            playwright-report/
            test-results/
          retention-days: 14
