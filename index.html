<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vokabel-Studio</title>
  <meta name="description" content="Vokabeln aus dem Schulbuch lernen – Englisch und Latein">
  <meta name="theme-color" content="#2f5bd3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vokabeln">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo-96.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Gemerktes Design sofort setzen, damit beim Start nichts hell aufblitzt
    try {
      var d = localStorage.getItem((/beta/i.test(location.pathname) ? 'vsb-' : 'vs-') + 'design');
      if (d === 'dunkel') document.documentElement.dataset.theme = 'dark';
      else if (d === 'hell') document.documentElement.dataset.theme = 'light';
      var tg = localStorage.getItem((/beta/i.test(location.pathname) ? 'vsb-' : 'vs-') + 'text');
      if (tg === 'gross') document.documentElement.style.zoom = '1.15';
      else if (tg === 'sehrgross') document.documentElement.style.zoom = '1.3';
      var st = localStorage.getItem((/beta/i.test(location.pathname) ? 'vsb-' : 'vs-') + 'style');
      if (st && st !== 'standard') document.documentElement.dataset.style = st;
    } catch (e) { /* privat */ }
  </script>
</head>
<body>
  <header class="topbar">
    <button class="topbar-back" id="btn-back" aria-label="Zurück" hidden>‹</button>
    <h1 class="topbar-title" id="title">Vokabel-Studio</h1>
    <button class="topbar-profile" id="btn-profile" aria-label="Profil wechseln" hidden></button>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Vokabel-Studio braucht JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
